# Tool-free CI: stdlib Python + pytest + jq only. No klt, ngspice or PDK.
# Every command below lives in ./check-ci.sh, the single source for the check
# list; each step names one of its stages. README.md ("Continuous integration")
# points at the same script.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest==9.2.0
      - name: unit tests
        run: ./check-ci.sh tests
      - name: netlists are fresh
        run: ./check-ci.sh netlists
      - name: layouts are fresh
        run: ./check-ci.sh layouts
      - name: evidence check accepts the committed record
        run: ./check-ci.sh evidence-accept
      - name: evidence check rejects the negative control
        run: ./check-ci.sh evidence-reject
